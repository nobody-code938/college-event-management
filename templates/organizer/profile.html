{% extends 'base.html' %}

{% block title %}Organizer Profile - CampusEvent{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="custom-card p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold fs-2" style="width: 64px; height: 64px;">
                        {{ organizer.name[0].upper() }}
                    </div>
                    <div>
                        <h3 class="fw-bold mb-1">{{ organizer.name }}</h3>
                        <p class="text-muted mb-0"><i class="bi bi-envelope me-1"></i>{{ organizer.email }} • <span class="badge bg-primary text-white">{{ organizer.role|capitalize }}</span></p>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('organizer.profile') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ organizer.name }}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">Email Address (Read-only)</label>
                            <input type="email" class="form-control bg-light" id="email" value="{{ organizer.email }}" readonly>
                        </div>

                        <div class="col-md-6">
                            <label for="department" class="form-label fw-semibold">Department / Faculty</label>
                            <input type="text" class="form-control" id="department" name="department" value="{{ organizer.department or '' }}">
                        </div>

                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold">Phone Contact</label>
                            <input type="tel" class="form-control" id="phone" name="phone" value="{{ organizer.phone or '' }}">
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top text-end">
                        <button type="submit" class="btn btn-primary-gradient px-4">
                            <i class="bi bi-check-lg me-1"></i>Update Profile
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
