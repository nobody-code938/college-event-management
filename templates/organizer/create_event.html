{% extends 'base.html' %}

{% block title %}Create New Event - CampusEvent{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="custom-card p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                    <div class="stat-icon primary">
                        <i class="bi bi-calendar-plus-fill"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-1">Create New Campus Event</h3>
                        <p class="text-muted mb-0">Fill out details below to publish an event for students</p>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('organizer.create_event') }}">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="title" class="form-label fw-semibold">Event Title *</label>
                            <input type="text" class="form-control" id="title" name="title" placeholder="e.g. CodeSprint 24H Hackathon" required>
                        </div>

                        <div class="col-md-6">
                            <label for="category" class="form-label fw-semibold">Event Category *</label>
                            <select class="form-select" id="category" name="category" required>
                                {% for cat in categories %}
                                    <option value="{{ cat }}">{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="capacity" class="form-label fw-semibold">Student Capacity *</label>
                            <input type="number" class="form-control" id="capacity" name="capacity" value="100" min="1" max="5000" required>
                        </div>

                        <div class="col-md-6">
                            <label for="date" class="form-label fw-semibold">Event Date *</label>
                            <input type="date" class="form-control" id="date" name="date" required>
                        </div>

                        <div class="col-md-6">
                            <label for="time" class="form-label fw-semibold">Event Time *</label>
                            <input type="time" class="form-control" id="time" name="time" required>
                        </div>

                        <div class="col-12">
                            <label for="venue" class="form-label fw-semibold">Venue / Location *</label>
                            <input type="text" class="form-control" id="venue" name="venue" placeholder="e.g. Main Auditorium & Tech Lab 3" required>
                        </div>

                        <div class="col-12">
                            <label for="description" class="form-label fw-semibold">Detailed Description *</label>
                            <textarea class="form-control" id="description" name="description" rows="5" placeholder="Provide event schedule, prerequisites, rules, and guidelines..." required></textarea>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('organizer.my_events') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary-gradient px-4">
                            <i class="bi bi-cloud-arrow-up me-1"></i>Publish Event
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
