{% extends 'base.html' %}

{% block title %}Register - CampusEvent{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="custom-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="stat-icon success mx-auto mb-3">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Create Account</h3>
                    <p class="text-muted small">Join CampusEvent platform as a Student or Organizer</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="name" class="form-label fw-semibold">Full Name *</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Aarav Patel" required>
                        </div>

                        <div class="col-12">
                            <label for="email" class="form-label fw-semibold">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="student@example.com" required>
                        </div>

                        <div class="col-md-6">
                            <label for="role" class="form-label fw-semibold">Account Role *</label>
                            <select class="form-select" id="role" name="role">
                                <option value="student" selected>Student</option>
                                <option value="organizer">Faculty / Organizer</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="department" class="form-label fw-semibold">Department</label>
                            <select class="form-select" id="department" name="department">
                                <option value="Computer Science & Engineering" selected>Computer Science (CSE)</option>
                                <option value="Information Technology">Information Technology (IT)</option>
                                <option value="Electronics & Communication">Electronics (ECE)</option>
                                <option value="Mechanical Engineering">Mechanical (ME)</option>
                                <option value="Civil Engineering">Civil (CE)</option>
                                <option value="Electrical Engineering">Electrical (EEE)</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="year" class="form-label fw-semibold">Academic Year</label>
                            <select class="form-select" id="year" name="year">
                                <option value="1st Year">1st Year</option>
                                <option value="2nd Year">2nd Year</option>
                                <option value="3rd Year" selected>3rd Year</option>
                                <option value="4th Year">4th Year</option>
                                <option value="Faculty">Faculty / Staff</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="9876543210">
                        </div>

                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 6 characters" required>
                        </div>

                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label fw-semibold">Confirm Password *</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-type password" required>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary-gradient w-100 py-2 fs-6">
                            <i class="bi bi-person-check me-2"></i>Complete Registration
                        </button>
                    </div>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <p class="small text-muted mb-0">
                        Already registered? 
                        <a href="{{ url_for('auth.login') }}" class="fw-bold text-primary">Log In Here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
