{% extends 'base.html' %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="stat-icon info mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2.5rem;">
            <i class="bi bi-bug"></i>
        </div>
        <h1 class="display-4 fw-extrabold text-dark mb-2">500</h1>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted max-w-md mx-auto mb-4">
            Something went wrong on our end. Please try refreshing the page or try again later.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-primary-gradient px-4 py-2">
            <i class="bi bi-house-door me-2"></i>Return to Home
        </a>
    </div>
</div>
{% endblock %}
