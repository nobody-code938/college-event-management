{% extends 'base.html' %}

{% block title %}403 - Forbidden Access{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="stat-icon danger mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2.5rem;">
            <i class="bi bi-shield-lock"></i>
        </div>
        <h1 class="display-4 fw-extrabold text-dark mb-2">403</h1>
        <h3 class="fw-bold mb-3">Access Forbidden</h3>
        <p class="text-muted max-w-md mx-auto mb-4">
            You do not have permission to view this resource. Please make sure you are logged into an account with proper privileges.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-primary-gradient px-4 py-2">
            <i class="bi bi-house-door me-2"></i>Return to Home
        </a>
    </div>
</div>
{% endblock %}
