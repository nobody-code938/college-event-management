{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="stat-icon warning mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2.5rem;">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h1 class="display-4 fw-extrabold text-dark mb-2">404</h1>
        <h3 class="fw-bold mb-3">Page Not Found</h3>
        <p class="text-muted max-w-md mx-auto mb-4">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-primary-gradient px-4 py-2">
            <i class="bi bi-house-door me-2"></i>Return to Home
        </a>
    </div>
</div>
{% endblock %}
