services:
  - type: web
    name: college-event-management
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn "app:create_app()"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
